<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>秋日豐收・感恩籃子</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(170deg, #2b1d14 0%, #18110c 100%);
      color: #fffbeb;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      touch-action: none;
    }

    .game-shell {
      position: relative;
      width: 380px;
      max-width: 94vw;
      height: 560px;
      max-height: 86vh;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(251, 191, 36, 0.45);
      background: linear-gradient(180deg, #4a2c18 0%, #7c471e 55%, #5c3314 100%);
    }

    canvas#gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .top-bar {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: bold;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.65);
      pointer-events: none;
      z-index: 5;
      gap: 8px;
    }
    .pill {
      background: rgba(0, 0, 0, 0.36);
      padding: 5px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .score-pill { color: #fde68a; }
    .blessing-pill { color: #fcd34d; }
    .hearts-pill { color: #fca5a5; }

    /* 感恩小卡彈出條 */
    #gratitudeBanner {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 78px;
      background: rgba(255, 251, 235, 0.96);
      color: #3b2314;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 13.5px;
      line-height: 1.5;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      border-left: 5px solid #d97706;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
      z-index: 8;
    }
    #gratitudeBanner.show {
      opacity: 1;
      transform: translateY(0);
    }
    #gratitudeBanner strong {
      color: #b45309;
      display: block;
      margin-bottom: 2px;
      font-size: 12.5px;
    }

    /* 開始 / 結算遮罩 */
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(24, 15, 9, 0.89);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 22px;
      z-index: 15;
    }
    #overlay h1 {
      font-size: 24px;
      color: #fde68a;
      margin-bottom: 10px;
      letter-spacing: 1.5px;
    }
    #overlay p {
      font-size: 13.5px;
      line-height: 1.65;
      color: #f3e8d2;
      margin-bottom: 12px;
    }
    .tips-box {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12.5px;
      line-height: 1.65;
      color: #fde68a;
      margin-bottom: 16px;
      width: 100%;
    }
    .unlocked-list {
      text-align: left;
      max-height: 145px;
      overflow-y: auto;
      width: 100%;
      background: rgba(255, 251, 235, 0.08);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 16px;
      font-size: 12.5px;
      line-height: 1.55;
      color: #fef3c7;
      display: none;
    }
    #startBtn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #1f1209;
      border: none;
      border-radius: 12px;
      padding: 11px 26px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.35);
    }
    #startBtn:active { transform: scale(0.96); }

    .footer-hint {
      margin-top: 8px;
      font-size: 12.5px;
      color: #d6c3a5;
    }
  </style>
</head>
<body>

  <div class="game-shell">
    <div class="top-bar">
      <div class="pill score-pill">分數：<span id="scoreText">0</span></div>
      <div class="pill blessing-pill">祝福：<span id="blessingText">0</span>/5</div>
      <div class="pill hearts-pill" id="heartsText">♥♥♥</div>
    </div>

    <canvas id="gameCanvas" width="380" height="560"></canvas>

    <div id="gratitudeBanner">
      <strong id="bannerTitle">✦ 解鎖感恩祝福 ✦</strong>
      <span id="gratitudeMsg"></span>
    </div>

    <div id="overlay">
      <h1 id="overlayTitle">🍂 秋日豐收・感恩籃子 🍂</h1>
      <p id="overlayDesc">
        接住豐收好物解鎖感恩祝福（最高 5 句）！<br>
        首句 60 分解鎖，之後每階段所需分數遞增 30 分，且每達階段速度加快 30%。
      </p>
      <div class="tips-box">
        🎃 南瓜 +15 🌽 玉米 +10 🍎 蘋果 +10<br>
        🔥 烤焦鍋子：碰到會扣 1 顆心（共 3 顆）
      </div>
      <div class="unlocked-list" id="unlockedList"></div>
      <button id="startBtn">開始豐收</button>
    </div>
  </div>

  <div class="footer-hint">電腦：← → 鍵或滑鼠拖曳 ／ 手機：左右滑動</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const blessingText = document.getElementById('blessingText');
    const heartsText = document.getElementById('heartsText');
    const banner = document.getElementById('gratitudeBanner');
    const bannerTitle = document.getElementById('bannerTitle');
    const gratitudeMsg = document.getElementById('gratitudeMsg');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');
    const unlockedList = document.getElementById('unlockedList');
    const startBtn = document.getElementById('startBtn');

    const MAX_BLESSINGS = 5;
    const BASE_UNLOCK_SCORE = 60;
    const STAGE_INCREMENT = 30;
    const SPEED_UP_FACTOR = 1.3;

    const gratitudeQuotes = [
      "感謝今天能安穩吃下一頓飯，也感謝願意陪伴與理解你的人。",
      "有些看似平凡的小事，其實正是生活裡最踏實的禮物。",
      "謝謝自己一路走到現在的努力，今天也給自己一點掌聲。",
      "感謝季節的轉換與自然的呼吸，讓人有機會慢下腳步。",
      "把想感謝的人放在心上，傳一聲問候，暖意就會擴散開來。",
      "就算有未完成的事，也記得看見已經擁有的美好與恩典。",
      "感恩不是因為一切都完美，而是願意在日常裡發現微光。",
      "謝謝那些在忙碌中替你留一盞燈、遞一杯熱茶的溫柔時刻。",
      "每一次平安度過的尋常日子，都值得在心裡輕輕說一聲謝謝。",
      "感謝生命中的轉彎與等待，它們正悄悄把你帶往更合適的風景。",
      "當我們開始數算擁有的福氣，心裡的焦慮就會慢慢安靜下來。",
      "謝謝家人與朋友的不完美卻真誠，讓這個世界多了一個可以依靠的角落。",
      "今天的陽光、微風與呼吸，都是無需預約卻準時送達的祝福。",
      "願你的善良總能遇見懂得珍惜的人，也願你被這份溫暖好好接住。",
      "把「謝謝」說出口，不只是給別人的鼓勵，也是送給自己的一份喜樂。"
    ];

    let running = false;
    let score = 0;
    let hearts = 3;
    let stageCount = 0;          // 已達成的階段數（影響速度倍率）
    let speedMultiplier = 1.0;   // 目前速度倍率
    let currentStep = BASE_UNLOCK_SCORE; // 下一階段需增加的分數（60, 90, 120...）
    let nextMilestone = BASE_UNLOCK_SCORE; // 下一階段累計分數門檻

    let roundDeck = [];
    let unlockedQuotes = [];
    let spawnAccumulator = 0;
    let bannerTimer = null;

    const basket = {
      x: 150,
      y: 492,
      w: 80,
      h: 36,
      baseSpeed: 6.8
    };

    const keys = { left: false, right: false };
    let items = [];
    let sparkles = [];

    const leaves = Array.from({ length: 12 }, () => ({
      x: Math.random() * 380,
      y: Math.random() * 560,
      vy: 0.5 + Math.random() * 0.9,
      vx: -0.3 + Math.random() * 0.6,
      size: 6 + Math.random() * 5,
      rot: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.04
    }));

    function shuffleQuotes() {
      roundDeck = [...gratitudeQuotes];
      for (let i = roundDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [roundDeck[i], roundDeck[j]] = [roundDeck[j], roundDeck[i]];
      }
    }

    function showGratitude(indexNum, quote, accelerated) {
      bannerTitle.textContent = accelerated
        ? `✦ 第 ${indexNum} 句祝福（速度加快 30%！）✦`
        : `✦ 第 ${indexNum} 句祝福（已達上限 5 句）✦`;
      gratitudeMsg.textContent = quote;
      banner.classList.add('show');
      clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => {
        banner.classList.remove('show');
      }, 3400);
    }

    function updateHearts() {
      heartsText.textContent = '♥'.repeat(Math.max(0, hearts)) + '♡'.repeat(Math.max(0, 3 - hearts));
    }

    function updateBlessingHud() {
      blessingText.textContent = `${unlockedQuotes.length}`;
    }

    function startGame() {
      score = 0;
      hearts = 3;
      stageCount = 0;
      speedMultiplier = 1.0;
      currentStep = BASE_UNLOCK_SCORE; // 第一階段：60 分
      nextMilestone = BASE_UNLOCK_SCORE;

      shuffleQuotes();
      unlockedQuotes = [];
      spawnAccumulator = 38;
      items = [];
      sparkles = [];
      basket.x = (canvas.width - basket.w) / 2;
      running = true;

      scoreText.textContent = '0';
      updateBlessingHud();
      updateHearts();
      banner.classList.remove('show');
      unlockedList.style.display = 'none';
      unlockedList.innerHTML = '';
      overlay.style.display = 'none';
      requestAnimationFrame(loop);
    }

    function endGame() {
      running = false;
      overlayTitle.textContent = '🍂 豐收告一段落 🍂';
      overlayDesc.innerHTML =
        `本次得分：<strong>${score}</strong> 分 ｜ 獲得祝福：<strong>${unlockedQuotes.length} / ${MAX_BLESSINGS}</strong> 句`;

      if (unlockedQuotes.length > 0) {
        unlockedList.style.display = 'block';
        unlockedList.innerHTML =
          `<div style="font-weight:bold;margin-bottom:6px;color:#fbbf24;">本局得到的感恩祝福：</div>` +
          unlockedQuotes.map((q, idx) => `<div style="margin-bottom:6px;">${idx + 1}. ${q}</div>`).join('');
      }

      startBtn.textContent = '再玩一次';
      overlay.style.display = 'flex';
    }

    // 檢查是否達成階段門檻（速度加快 30%＋遞增 30 分＋最高 5 句祝福）
    function checkStageProgression() {
      while (score >= nextMilestone) {
        stageCount += 1;
        speedMultiplier *= SPEED_UP_FACTOR;

        if (unlockedQuotes.length < MAX_BLESSINGS) {
          if (roundDeck.length === 0) shuffleQuotes();
          const quote = roundDeck.pop();
          unlockedQuotes.push(quote);
          updateBlessingHud();
          showGratitude(unlockedQuotes.length, quote, true);
        }

        // 每一階段所需增加的分數遞增 30 分（60 -> 90 -> 120 -> 150...）
        currentStep += STAGE_INCREMENT;
        nextMilestone += currentStep;
      }
    }

    function spawnItem() {
      const r = Math.random();
      let kind = 'corn';
      let points = 10;
      if (r < 0.22) {
        kind = 'burn';
        points = 0;
      } else if (r < 0.52) {
        kind = 'pumpkin';
        points = 15;
      } else if (r < 0.78) {
        kind = 'apple';
        points = 10;
      }

      const baseFallSpeed = 2.5 + Math.random() * 1.4;
      items.push({
        kind,
        points,
        x: 34 + Math.random() * (canvas.width - 68),
        y: -26,
        r: 20,
        baseVy: baseFallSpeed
      });
    }

    function addSparkles(x, y, color) {
      for (let i = 0; i < 10; i++) {
        const ang = (Math.PI * 2 * i) / 10;
        sparkles.push({
          x, y,
          vx: Math.cos(ang) * (1.5 + Math.random() * 2.5),
          vy: Math.sin(ang) * (1.5 + Math.random() * 2.5) - 1,
          life: 1,
          color
        });
      }
    }

    function drawItem(it) {
      ctx.save();
      ctx.translate(it.x, it.y);

      if (it.kind === 'pumpkin') {
        ctx.fillStyle = '#ea580c';
        ctx.beginPath();
        ctx.ellipse(0, 2, 20, 16, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#9a3412';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(0, 2, 9, 16, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#15803d';
        ctx.fillRect(-3, -18, 6, 7);
      } else if (it.kind === 'apple') {
        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.arc(0, 2, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#16a34a';
        ctx.beginPath();
        ctx.ellipse(6, -15, 7, 4, -0.4, 0, Math.PI * 2);
        ctx.fill();
      } else if (it.kind === 'corn') {
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.ellipse(0, 1, 11, 18, 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ca8a04';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = '#4ade80';
        ctx.beginPath();
        ctx.ellipse(-7, 6, 7, 13, -0.35, 0, Math.PI * 2);
        ctx.ellipse(7, 6, 7, 13, 0.35, 0, Math.PI * 2);
        ctx.fill();
      } else if (it.kind === 'burn') {
        ctx.fillStyle = '#27272a';
        ctx.beginPath();
        ctx.arc(0, 3, 17, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#f87171';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#f87171';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✕', 0, 4);
      }

      ctx.restore();
    }

    function drawBasket() {
      ctx.save();
      ctx.translate(basket.x, basket.y);

      ctx.fillStyle = '#b45309';
      ctx.beginPath();
      ctx.roundRect(0, 4, basket.w, basket.h - 4, [4, 4, 16, 16]);
      ctx.fill();

      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.roundRect(-4, 0, basket.w + 8, 9, 4);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 251, 235, 0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(16, 10); ctx.lineTo(22, basket.h - 2);
      ctx.moveTo(40, 10); ctx.lineTo(40, basket.h - 2);
      ctx.moveTo(64, 10); ctx.lineTo(58, basket.h - 2);
      ctx.stroke();

      ctx.restore();
    }

    function loop() {
      if (!running) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 背景落葉
      for (const lf of leaves) {
        lf.y += lf.vy;
        lf.x += lf.vx;
        lf.rot += lf.vRot;
        if (lf.y > canvas.height + 12) {
          lf.y = -12;
          lf.x = Math.random() * canvas.width;
        }
        ctx.save();
        ctx.translate(lf.x, lf.y);
        ctx.rotate(lf.rot);
        ctx.fillStyle = 'rgba(251, 146, 60, 0.28)';
        ctx.beginPath();
        ctx.ellipse(0, 0, lf.size, lf.size * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 鍵盤移動籃子（隨速度倍率略微提升手感，避免跟不上）
      const moveSpeed = basket.baseSpeed * Math.min(1.6, 1 + (speedMultiplier - 1) * 0.45);
      if (keys.left) basket.x -= moveSpeed;
      if (keys.right) basket.x += moveSpeed;
      basket.x = Math.max(6, Math.min(canvas.width - basket.w - 6, basket.x));

      // 產生掉落物頻率也隨速度倍率加快
      spawnAccumulator += speedMultiplier;
      if (spawnAccumulator >= 58) {
        spawnItem();
        spawnAccumulator = 0;
      }

      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.y += it.baseVy * speedMultiplier;
        drawItem(it);

        const caught =
          it.x + it.r > basket.x + 4 &&
          it.x - it.r < basket.x + basket.w - 4 &&
          it.y + it.r > basket.y &&
          it.y - it.r < basket.y + basket.h;

        if (caught) {
          if (it.kind === 'burn') {
            hearts -= 1;
            updateHearts();
            addSparkles(it.x, it.y, '#f87171');
            items.splice(i, 1);
            if (hearts <= 0) {
              endGame();
              return;
            }
          } else {
            score += it.points;
            scoreText.textContent = score;
            addSparkles(it.x, it.y, '#fde047');
            items.splice(i, 1);
            checkStageProgression();
          }
          continue;
        }

        if (it.y - it.r > canvas.height) {
          items.splice(i, 1);
        }
      }

      for (let i = sparkles.length - 1; i >= 0; i--) {
        const sp = sparkles[i];
        sp.x += sp.vx;
        sp.y += sp.vy;
        sp.life -= 0.035;
        if (sp.life <= 0) { sparkles.splice(i, 1); continue; }
        ctx.globalAlpha = Math.max(0, sp.life);
        ctx.fillStyle = sp.color;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      drawBasket();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D
