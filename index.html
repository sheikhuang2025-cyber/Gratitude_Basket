<!-- 結算視窗範例 -->
<div id="endModal" class="end-modal">
  <h2>🍂 豐收告一段落 🍂</h2>
  <p id="summaryScore">本次得分：420 分 ｜ 獲得祝福：4/5 句</p>

  <!-- 1. 物品點數說明框：結算時隱藏，不再佔用垂直空間 -->
  <div id="itemLegendBox" class="item-legend" style="display: none;">
    🎃 金黃南瓜 +15 🍗 烤火雞腿 +15<br>
    🍎 紅蘋果 +10 🌽 金穗玉米 +10<br>
    🔥 焦黑鍋子：碰到會扣 1 顆心（共 3 顆）
  </div>

  <!-- 2. 祝福／經文區塊：取得更大空間，內容多時可順暢捲動 -->
  <div id="blessingBox" class="blessing-box">
    <div class="blessing-title">本局得到的感恩祝福：</div>
    <ol id="blessingList" class="blessing-list"></ol>
  </div>

  <button id="restartBtn" class="restart-btn">再玩一次</button>
</div>
