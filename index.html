<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>秋日豐收・感恩籃子</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(170deg, #24170f 0%, #130c07 100%);
      color: #fffbeb;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      touch-action: none;
    }

    .game-shell {
      position: relative;
      width: 380px;
      max-width: 94vw;
      height: 560px;
      max-height: 86vh;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 46px rgba(0, 0, 0, 0.68);
      border: 1.5px solid rgba(251, 191, 36, 0.42);
      background: linear-gradient(180deg, #3a2214 0%, #633818 56%, #45250e 100%);
    }

    canvas#gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .top-bar {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: bold;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.75);
      pointer-events: none;
      z-index: 6;
      gap: 6px;
    }
    .pill {
      background: rgba(18, 10, 5, 0.6);
      border: 1px solid rgba(253, 230, 138, 0.18);
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .score-pill { color: #fde68a; }
    .blessing-pill { color: #fcd34d; }
    .hearts-pill { color: #fca5a5; }

    /* 改善：改放頂部精簡浮動條，不遮擋中下段接物視線 */
    #gratitudeBanner {
      position: absolute;
      top: 46px;
      left: 12px;
      right: 12px;
      background: rgba(255, 251, 235, 0.94);
      color: #3b2314;
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 12px;
      line-height: 1.4;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      border-left: 4px solid #d97706;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      z-index: 8;
    }
    #gratitudeBanner.show {
      opacity: 1;
      transform: translateY(0);
    }
    #gratitudeBanner strong {
      color: #b45309;
      margin-right: 4px;
      font-size: 11.5px;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(20, 12, 7, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 22px;
      z-index: 15;
    }
    #overlay h1 {
      font-size: 24px;
      color: #fde68a;
      margin-bottom: 10px;
      letter-spacing: 1.5px;
    }
    #overlay p {
      font-size: 13.5px;
      line-height: 1.65;
      color: #f3e8d2;
      margin-bottom: 12px;
    }
    .tips-box {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(253, 230, 138, 0.16);
      border-radius: 12px;
      padding: 8px 10px 10px;
      color: #fde68a;
      margin-bottom: 14px;
      width: 100%;
    }
    .tips-title {
      font-size: 12px;
      margin-bottom: 4px;
      color: #fcd34d;
    }
    .tips-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px 4px;
    }
    .tips-danger {
      display: flex;
      justify-content: center;
      gap: 26px;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed rgba(253, 230, 138, 0.22);
    }
    .tip-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 12.5px;
      font-weight: bold;
      line-height: 1.2;
    }
    .tip-cell canvas {
      width: 42px;
      height: 42px;
    }
    .tip-cell.top { color: #fde047; }
    .tip-cell.bad { color: #fca5a5; }

    .unlocked-list {
      text-align: left;
      flex: 0 1 auto;
      min-height: 0;
      overflow-y: auto;
      width: 100%;
      background: rgba(255, 251, 235, 0.08);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 16px;
      line-height: 1.7;
      color: #fef3c7;
      display: none;
    }
    #overlay h1, #overlay p, #startBtn { flex-shrink: 0; }
    #startBtn {
      background: linear-gradient(135deg, #f59e0b, #c26d10);
      color: #1c0f06;
      border: none;
      border-radius: 12px;
      padding: 11px 28px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.35);
    }
    #startBtn:active { transform: scale(0.96); }

    .footer-hint {
      margin-top: 8px;
      font-size: 12.5px;
      color: #cbb697;
    }
  </style>
</head>
<body>

  <div class="game-shell">
    <div class="top-bar">
      <div class="pill score-pill">分數：<span id="scoreText">0</span></div>
      <div class="pill blessing-pill">祝福：<span id="blessingText">0</span>/5</div>
      <div class="pill hearts-pill" id="heartsText">♥♥♥</div>
    </div>

    <canvas id="gameCanvas" width="380" height="560"></canvas>

    <div id="gratitudeBanner">
      <strong id="bannerTitle">✦ 第1句・速度+30% ✦</strong>
      <span id="gratitudeMsg"></span>
    </div>

    <div id="overlay">
      <h1 id="overlayTitle">🍂 秋日豐收・感恩籃子 🍂</h1>
      <p id="overlayDesc">
        接住豐收好物解鎖感恩祝福（最高 5 句）！<br>
        首句 60 分解鎖，之後每階段所需分數遞增 30 分，且每達階段速度加快 30%。
      </p>
      <div class="tips-box" id="tipsBox">
        <div class="tips-title">接住禮物得分：越小越快、分數越高</div>
        <div class="tips-grid" id="tipsGrid"></div>
        <div class="tips-danger" id="tipsDanger"></div>
      </div>
      <div class="unlocked-list" id="unlockedList"></div>
      <button id="startBtn" type="button" onclick="window.startHarvestGame()">開始豐收</button>
    </div>
  </div>

  <div class="footer-hint">電腦：← → 鍵或滑鼠拖曳 ／ 手機：左右滑動</div>

  <script>
    (function () {
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const scoreText = document.getElementById("scoreText");
      const blessingText = document.getElementById("blessingText");
      const heartsText = document.getElementById("heartsText");
      const banner = document.getElementById("gratitudeBanner");
      const bannerTitle = document.getElementById("bannerTitle");
      const gratitudeMsg = document.getElementById("gratitudeMsg");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayDesc = document.getElementById("overlayDesc");
      const unlockedList = document.getElementById("unlockedList");
      const startBtn = document.getElementById("startBtn");

      const MAX_BLESSINGS = 5;
      const BASE_UNLOCK_SCORE = 60;
      const STAGE_INCREMENT = 30;
      const SPEED_UP_FACTOR = 1.3;

      const gratitudeQuotes = [
        "感謝今天能安穩吃下一頓飯，也感謝願意陪伴與理解你的人。",
        "有些看似平凡的小事，其實正是生活裡最踏實的禮物。",
        "謝謝自己一路走到現在的努力，今天也給自己一點掌聲。",
        "感謝季節的轉換與自然的呼吸，讓人有機會慢下腳步。",
        "把想感謝的人放在心上，傳一聲問候，暖意就會擴散開來。",
        "就算有未完成的事，也記得看見已經擁有的美好與恩典。",
        "感恩不是因為一切都完美，而是願意在日常裡發現微光。",
        "謝謝那些在忙碌中替你留一盞燈、遞一杯熱茶的溫柔時刻。",
        "每一次平安度過的尋常日子，都值得在心裡輕輕說一聲謝謝。",
        "感謝生命中的轉彎與等待，它們正悄悄把你帶往更合適的風景。",
        "當我們開始數算擁有的福氣，心裡的焦慮就會慢慢安靜下來。",
        "謝謝家人與朋友的不完美卻真誠，讓這個世界多了一個可以依靠的角落。",
        "今天的陽光、微風與呼吸，都是無需預約卻準時送達的祝福。",
        "願你的善良總能遇見懂得珍惜的人，也願你被這份溫暖好好接住。",
        "把「謝謝」說出口，不只是給別人的鼓勵，也是送給自己的一份喜樂。"
      ];

      let running = false;
      let rafId = null;
      let score = 0;
      let hearts = 3;
      let speedMultiplier = 1.0;
      let currentStep = BASE_UNLOCK_SCORE;
      let nextMilestone = BASE_UNLOCK_SCORE;

      let roundDeck = [];
      let unlockedQuotes = [];
      let spawnAccumulator = 0;
      let bannerTimer = null;

      const basket = {
        x: 150,
        y: 494,
        w: 70,
        h: 34,
        baseSpeed: 6.8,
        hit: 0,
        hitColor: "239,68,68"
      };

      const keys = { left: false, right: false };
      let items = [];
      let sparkles = [];

      const leaves = Array.from({ length: 12 }, () => ({
        x: Math.random() * 380,
        y: Math.random() * 560,
        vy: 0.45 + Math.random() * 0.8,
        vx: -0.25 + Math.random() * 0.5,
        size: 5.5 + Math.random() * 4.5,
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.035
      }));

      function drawRoundRect(x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
      }

      function shuffleQuotes() {
        roundDeck = gratitudeQuotes.slice();
        for (let i = roundDeck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = roundDeck[i];
          roundDeck[i] = roundDeck[j];
          roundDeck[j] = tmp;
        }
      }

      function showGratitude(indexNum, quote, accelerated) {
        bannerTitle.textContent = accelerated
          ? "✦ 第" + indexNum + "句・速度+30% ✦"
          : "✦ 第" + indexNum + "句・已達上限 ✦";
        gratitudeMsg.textContent = quote;
        banner.classList.add("show");
        clearTimeout(bannerTimer);
        bannerTimer = setTimeout(() => {
          banner.classList.remove("show");
        }, 2200);
      }

      function updateHearts() {
        heartsText.textContent =
          "♥".repeat(Math.max(0, hearts)) + "♡".repeat(Math.max(0, 3 - hearts));
      }

      function updateBlessingHud() {
        blessingText.textContent = String(unlockedQuotes.length);
      }

      function startGame() {
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }

        score = 0;
        hearts = 3;
        speedMultiplier = 1.0;
        currentStep = BASE_UNLOCK_SCORE;
        nextMilestone = BASE_UNLOCK_SCORE;

        shuffleQuotes();
        unlockedQuotes = [];
        spawnAccumulator = 50;
        items = [];
        sparkles = [];
        particles = [];
        rings = [];
        floaters = [];
        flash = 0;
        shake = 0;
        dying = false;
        dyingTimer = 0;
        lastLane = -1;
        recentLanes = [];
        lastWasDanger = false;
        basket.hit = 0;
        basket.x = (canvas.width - basket.w) / 2;

        scoreText.textContent = "0";
        updateBlessingHud();
        updateHearts();
        banner.classList.remove("show");
        unlockedList.style.display = "none";
        unlockedList.innerHTML = "";
        overlay.style.display = "none";

        running = true;
        rafId = requestAnimationFrame(loop);
      }

      function endGame() {
        running = false;
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }

        overlayTitle.textContent = "🍂 豐收告一段落 🍂";
        const tipsBox = document.querySelector(".tips-box");
        if (tipsBox) tipsBox.style.display = "none";
        overlayDesc.innerHTML =
          "本次得分：<strong>" + score + "</strong> 分 ｜ 獲得祝福：<strong>" +
          unlockedQuotes.length + " / " + MAX_BLESSINGS + "</strong> 句";

        if (unlockedQuotes.length > 0) {
          unlockedList.style.display = "block";
          unlockedList.innerHTML =
            '<div style="font-weight:bold;margin-bottom:6px;color:#fbbf24;">本局得到的感恩祝福：</div>' +
            unlockedQuotes
              .map((q, idx) => '<div style="margin-bottom:6px;">' + (idx + 1) + ". " + q + "</div>")
              .join("");
        }

        startBtn.textContent = "再玩一次";
        overlay.style.display = "flex";
      }

      function checkStageProgression() {
        while (score >= nextMilestone) {
          speedMultiplier = Math.min(MAX_SPEED, speedMultiplier * SPEED_UP_FACTOR);

          if (unlockedQuotes.length < MAX_BLESSINGS) {
            if (roundDeck.length === 0) shuffleQuotes();
            const quote = roundDeck.pop();
            unlockedQuotes.push(quote);
            updateBlessingHud();
            showGratitude(unlockedQuotes.length, quote, true);
          }

          currentStep += STAGE_INCREMENT;
          nextMilestone += currentStep;
        }
      }

      // ===== 物品設定：越小越快、分數越高；大的慢、分數低 =====
      const ITEM_TYPES = {
        pumpkin: { type: "gift", points: 2,  r: 27, vy: 1.45, weight: 12 },
        corn:    { type: "gift", points: 3,  r: 25, vy: 1.65, weight: 12 },
        bread:   { type: "gift", points: 4,  r: 24, vy: 1.85, weight: 11 },
        grape:   { type: "gift", points: 5,  r: 22, vy: 2.05, weight: 10 },
        apple:   { type: "gift", points: 6,  r: 20, vy: 2.30, weight: 10 },
        acorn:   { type: "gift", points: 8,  r: 17, vy: 2.70, weight: 8 },
        honey:   { type: "gift", points: 10, r: 17, vy: 3.00, weight: 6 },
        star:    { type: "gift", points: 15, r: 15, vy: 3.50, weight: 4 },
        poison:  { type: "penalty", points: -5, r: 21, vy: 2.20, weight: 9 },
        bomb:    { type: "bomb", points: 0, r: 22, vy: 2.50, weight: 13 }
      };
      const GIFT_ORDER = ["pumpkin", "corn", "bread", "grape", "apple", "acorn", "honey", "star"];

      const LANES = 6;
      const SPAWN_INTERVAL = 80;
      const MAX_SPEED = 2.6;
      const PENALTY_POINTS = 5;

      let lastLane = -1;
      let recentLanes = [];
      let lastWasDanger = false;

      function rr(c, x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        c.beginPath();
        c.moveTo(x + radius, y);
        c.arcTo(x + w, y, x + w, y + h, radius);
        c.arcTo(x + w, y + h, x, y + h, radius);
        c.arcTo(x, y + h, x, y, radius);
        c.arcTo(x, y, x + w, y, radius);
        c.closePath();
      }

      // ===== 物品繪製（標準半徑約 20，繪圖時再依物品大小縮放） =====
      const DRAWERS = {
        pumpkin(c) {
          const lobe = (x, rx, light) => {
            const g = c.createRadialGradient(x - rx * 0.3, -4, 2, x, 3, rx * 1.9);
            g.addColorStop(0, light);
            g.addColorStop(0.6, "#ea580c");
            g.addColorStop(1, "#9a3412");
            c.fillStyle = g;
            c.beginPath();
            c.ellipse(x, 3, rx, 15.5, 0, 0, Math.PI * 2);
            c.fill();
            c.strokeStyle = "rgba(124,45,18,0.55)";
            c.lineWidth = 1.2;
            c.stroke();
          };
          lobe(-11.5, 9, "#fdba74");
          lobe(11.5, 9, "#fdba74");
          lobe(-5.5, 9.5, "#fdba74");
          lobe(5.5, 9.5, "#fdba74");
          lobe(0, 8, "#fed7aa");

          c.fillStyle = "#4d7c0f";
          c.beginPath();
          c.moveTo(-3.5, -11);
          c.lineTo(-2.5, -19);
          c.quadraticCurveTo(2, -22, 6, -18);
          c.lineTo(3.5, -11);
          c.closePath();
          c.fill();
          c.strokeStyle = "#3f6212";
          c.lineWidth = 1;
          c.stroke();

          c.strokeStyle = "#84cc16";
          c.lineWidth = 1.6;
          c.lineCap = "round";
          c.beginPath();
          c.moveTo(4, -17);
          c.bezierCurveTo(10, -22, 16, -20, 15, -15);
          c.bezierCurveTo(14, -12, 11, -14, 12.5, -16);
          c.stroke();

          c.fillStyle = "#65a30d";
          c.beginPath();
          c.ellipse(-9, -13, 6.5, 3, -0.5, 0, Math.PI * 2);
          c.fill();

          c.fillStyle = "rgba(255,255,255,0.35)";
          c.beginPath();
          c.ellipse(-8, -4, 3.5, 6, 0.3, 0, Math.PI * 2);
          c.fill();
        },

        corn(c) {
          const husk = (sx) => {
            c.save();
            c.scale(sx, 1);
            const g = c.createLinearGradient(0, 19, -14, -5);
            g.addColorStop(0, "#15803d");
            g.addColorStop(1, "#86efac");
            c.fillStyle = g;
            c.beginPath();
            c.moveTo(0, 19);
            c.bezierCurveTo(-14, 16, -17, 2, -13, -5);
            c.bezierCurveTo(-9, 2, -4, 8, 2, 12);
            c.closePath();
            c.fill();
            c.strokeStyle = "#166534";
            c.lineWidth = 1;
            c.stroke();
            c.restore();
          };

          c.save();
          c.beginPath();
          c.ellipse(0, -3, 8.5, 17, 0, 0, Math.PI * 2);
          const cg = c.createLinearGradient(-8, 0, 8, 0);
          cg.addColorStop(0, "#fde047");
          cg.addColorStop(0.5, "#facc15");
          cg.addColorStop(1, "#ca8a04");
          c.fillStyle = cg;
          c.fill();
          c.clip();
          for (let row = 0; row < 8; row++) {
            const y = -17 + row * 4.4;
            for (let col = -2; col <= 2; col++) {
              const x = col * 3.6 + (row % 2 ? 1.8 : 0);
              c.fillStyle = "#fef08a";
              c.beginPath();
              c.ellipse(x, y, 1.9, 2.1, 0, 0, Math.PI * 2);
              c.fill();
              c.strokeStyle = "rgba(180,83,9,0.5)";
              c.lineWidth = 0.7;
              c.stroke();
            }
          }
          c.restore();

          c.strokeStyle = "#a16207";
          c.lineWidth = 1.2;
          c.beginPath();
          c.ellipse(0, -3, 8.5, 17, 0, 0, Math.PI * 2);
          c.stroke();

          husk(1);
          husk(-1);

          c.fillStyle = "#78350f";
          rr(c, -2, 17, 4, 4, 1.5);
          c.fill();
        },

        bread(c) {
          const g = c.createRadialGradient(-6, -6, 3, 0, 3, 24);
          g.addColorStop(0, "#fcd34d");
          g.addColorStop(0.45, "#d98a2b");
          g.addColorStop(1, "#8a4513");
          c.fillStyle = g;
          c.beginPath();
          c.ellipse(0, 3, 20, 15, 0, 0, Math.PI * 2);
          c.fill();
          c.strokeStyle = "#6b3410";
          c.lineWidth = 1.4;
          c.stroke();

          c.lineCap = "round";
          for (let i = -1; i <= 1; i++) {
            c.beginPath();
            c.moveTo(i * 7 - 3, -4);
            c.quadraticCurveTo(i * 7, 2, i * 7 + 3, 9);
            c.strokeStyle = "#fef3c7";
            c.lineWidth = 3.4;
            c.stroke();
            c.strokeStyle = "rgba(120,53,15,0.55)";
            c.lineWidth = 1;
            c.stroke();
          }

          c.fillStyle = "rgba(255,255,255,0.55)";
          [[-12, 0], [-9, 8], [12, 2], [9, 9], [2, -9], [-4, -10]].forEach((p) => {
            c.beginPath();
            c.arc(p[0], p[1], 0.9, 0, Math.PI * 2);
            c.fill();
          });

          c.fillStyle = "rgba(255,255,255,0.25)";
          c.beginPath();
          c.ellipse(-9, -4, 4.5, 2.2, -0.5, 0, Math.PI * 2);
          c.fill();
        },

        grape(c) {
          c.strokeStyle = "#78350f";
          c.lineWidth = 2;
          c.lineCap = "round";
          c.beginPath();
          c.moveTo(0, -9);
          c.quadraticCurveTo(1, -14, 3, -18);
          c.stroke();

          c.fillStyle = "#4ade80";
          c.beginPath();
          c.moveTo(3, -16);
          c.bezierCurveTo(8, -24, 18, -20, 17, -12);
          c.bezierCurveTo(11, -10, 6, -11, 3, -16);
          c.closePath();
          c.fill();
          c.strokeStyle = "#15803d";
          c.lineWidth = 0.9;

      function drawItem(it) {
        ctx.save();
        ctx.translate(it.x, it.y);
        ctx.rotate(it.kind === "bomb" ? Math.sin(it.age * 0.07 + it.phase) * 0.6 : it.rot);
        const s = it.r / 20;
        ctx.scale(s, s);
        DRAWERS[it.kind](ctx, it.age);
        ctx.restore();
      }

      // ===== 生成：分區（左右輪流）、拉開間距 =====
      function laneX(l) {
        return (canvas.width / LANES) * (l + 0.5);
      }

      function pickLane() {
        const laneW = canvas.width / LANES;
        const bl = Math.max(0, Math.min(LANES - 1, Math.floor((basket.x + basket.w / 2) / laneW)));
        let cand = [];
        for (let l = 0; l < LANES; l++) {
          if (recentLanes.indexOf(l) !== -1) continue;
          if (lastLane >= 0 && Math.abs(l - lastLane) < 2) continue;
          cand.push(l);
        }
        if (!cand.length) {
          for (let l = 0; l < LANES; l++) if (l !== lastLane) cand.push(l);
        }
        let wsum = 0;
        const ws = cand.map((l) => {
          const w = 1 + Math.abs(l - bl) * 1.2;
          wsum += w;
          return w;
        });
        let r = Math.random() * wsum;
        let lane = cand[0];
        for (let i = 0; i < cand.length; i++) {
          r -= ws[i];
          if (r <= 0) {
            lane = cand[i];
            break;
          }
        }
        lastLane = lane;
        recentLanes.push(lane);
        if (recentLanes.length > 3) recentLanes.shift();
        return lane;
      }

      function pickKind() {
        const keys = Object.keys(ITEM_TYPES);
        let total = 0;
        keys.forEach((k) => { total += ITEM_TYPES[k].weight; });
        let pick = keys[0];
        for (let tries = 0; tries < 4; tries++) {
          let r = Math.random() * total;
          for (let i = 0; i < keys.length; i++) {
            r -= ITEM_TYPES[keys[i]].weight;
            if (r <= 0) {
              pick = keys[i];
              break;
            }
          }
          const danger = ITEM_TYPES[pick].type !== "gift";
          if (!(danger && lastWasDanger)) break;
        }
        lastWasDanger = ITEM_TYPES[pick].type !== "gift";
        return pick;
      }

      function spawnItem() {
        const kind = pickKind();
        const T = ITEM_TYPES[kind];
        const x = Math.max(
          T.r + 8,
          Math.min(canvas.width - T.r - 8, laneX(pickLane()) + (Math.random() - 0.5) * 24)
        );
        items.push({
          kind,
          type: T.type,
          points: T.points,
          x,
          y: -T.r - 6,
          r: T.r,
          vy: T.vy * (0.93 + Math.random() * 0.14),
          rot: Math.random() * Math.PI * 2,
          spin: (Math.random() < 0.5 ? -1 : 1) * (0.022 + Math.random() * 0.035),
          age: 0,
          phase: Math.random() * Math.PI * 2
        });
      }

      // ===== 特效 =====
      let particles = [];
      let rings = [];
      let floaters = [];
      let flash = 0;
      let shake = 0;
      let dying = false;
      let dyingTimer = 0;

      function addSparkles(x, y, color, count) {
        const n = count || 10;
        for (let i = 0; i < n; i++) {
          const ang = (Math.PI * 2 * i) / n;
          sparkles.push({
            x,
            y,
            vx: Math.cos(ang) * (1.4 + Math.random() * 2.2),
            vy: Math.sin(ang) * (1.4 + Math.random() * 2.2) - 0.8,
            life: 1,
            color
          });
        }
      }

      function addFloater(x, y, text, color) {
        floaters.push({ x, y, text, color, life: 1 });
      }

      function explode(x, y) {
        const colors = ["#fde047", "#fb923c", "#ef4444", "#fca5a5", "#7f1d1d"];
        for (let i = 0; i < 44; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = 1.5 + Math.random() * 6.5;
          particles.push({
            x, y,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp - 1.2,
            g: 0.12,
            life: 1,
            decay: 0.02 + Math.random() * 0.025,
            size: 3 + Math.random() * 6,
            color: colors[Math.floor(Math.random() * colors.length)],
            smoke: false
          });
        }
        for (let i = 0; i < 10; i++) {
          particles.push({
            x: x + (Math.random() - 0.5) * 20,
            y: y + (Math.random() - 0.5) * 12,
            vx: (Math.random() - 0.5) * 1.6,
            vy: -0.6 - Math.random() * 1.2,
            g: -0.01,
            life: 1,
            decay: 0.012 + Math.random() * 0.01,
            size: 8 + Math.random() * 7,
            color: "#52525b",
            smoke: true
          });
        }
        rings.push({ x, y, r: 6, life: 1, speed: 5 });
        rings.push({ x, y, r: 2, life: 1, speed: 3 });
        flash = 0.55;
        shake = 16;
      }

      function drawEffects() {
        for (let i = rings.length - 1; i >= 0; i--) {
          const rg = rings[i];
          rg.r += rg.speed;
          rg.life -= 0.045;
          if (rg.life <= 0) {
            rings.splice(i, 1);
            continue;
          }
          ctx.strokeStyle = "rgba(254,215,170," + rg.life.toFixed(2) + ")";
          ctx.lineWidth = 1 + 5 * rg.life;
          ctx.beginPath();
          ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2);
          ctx.stroke();
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.g;
          p.life -= p.decay;
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          ctx.globalAlpha = p.smoke ? p.life * 0.55 : p.life;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.smoke ? p.size * (1.6 - p.life * 0.6) : p.size * p.life, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }

        for (let i = floaters.length - 1; i >= 0; i--) {
          const f = floaters[i];
          f.y -= 0.9;
          f.life -= 0.02;
          if (f.life <= 0) {
            floaters.splice(i, 1);
            continue;
          }
          ctx.globalAlpha = Math.min(1, f.life * 1.6);
          ctx.font = "bold 19px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.lineWidth = 4;
          ctx.strokeStyle = "rgba(20,10,4,0.85)";
          ctx.strokeText(f.text, f.x, f.y);
          ctx.fillStyle = f.color;
          ctx.fillText(f.text, f.x, f.y);
          ctx.globalAlpha = 1;
        }
      }

      function drawBasket() {
        ctx.save();
        ctx.translate(basket.x, basket.y);

        const wGrad = ctx.createLinearGradient(0, 4, 0, basket.h);
        wGrad.addColorStop(0, "#c26d1f");
        wGrad.addColorStop(1, "#78350f");

        ctx.fillStyle = wGrad;
        drawRoundRect(0, 4, basket.w, basket.h - 4, 12);
        ctx.fill();

        ctx.strokeStyle = "rgba(255, 247, 214, 0.24)";
        ctx.lineWidth = 1.4;
        for (let gx = 12; gx < basket.w - 8; gx += 13) {
          ctx.beginPath();
          ctx.moveTo(gx, 9);
          ctx.lineTo(gx + 4, basket.h - 3);
          ctx.stroke();
        }

        const rimGrad = ctx.createLinearGradient(0, 0, 0, 9);
        rimGrad.addColorStop(0, "#fbbf24");
        rimGrad.addColorStop(1, "#b45309");

        ctx.fillStyle = rimGrad;
        drawRoundRect(-3, 0, basket.w + 6, 8, 4);
        ctx.fill();

        if (basket.hit > 0) {
          ctx.fillStyle = "rgba(" + basket.hitColor + "," + (0.55 * basket.hit / 22).toFixed(2) + ")";
          drawRoundRect(-3, 0, basket.w + 6, basket.h, 10);
          ctx.fill();
          basket.hit--;
        }

        ctx.restore();
      }

      function loop() {
        if (!running) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        if (shake > 0.4) {
          ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
          shake *= 0.88;
        } else {
          shake = 0;
        }

        for (let i = 0; i < leaves.length; i++) {
          const lf = leaves[i];
          lf.y += lf.vy;
          lf.x += lf.vx;
          lf.rot += lf.vRot;
          if (lf.y > canvas.height + 12) {
            lf.y = -12;
            lf.x = Math.random() * canvas.width;
          }
          ctx.save();
          ctx.translate(lf.x, lf.y);
          ctx.rotate(lf.rot);
          ctx.fillStyle = "rgba(251, 146, 60, 0.22)";
          ctx.beginPath();
          ctx.ellipse(0, 0, lf.size, lf.size * 0.52, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        if (!dying) {
          const moveSpeed = basket.baseSpeed * Math.min(1.6, 1 + (speedMultiplier - 1) * 0.45);
          if (keys.left) basket.x -= moveSpeed;
          if (keys.right) basket.x += moveSpeed;
          basket.x = Math.max(6, Math.min(canvas.width - basket.w - 6, basket.x));

          spawnAccumulator += speedMultiplier;
          if (spawnAccumulator >= SPAWN_INTERVAL) {
            spawnItem();
            spawnAccumulator = 0;
          }
        }

        for (let i = items.length - 1; i >= 0; i--) {
          const it = items[i];

          if (!dying) {
            it.age++;
            it.y += it.vy * speedMultiplier;
            it.rot += it.spin;
          }
          drawItem(it);
          if (dying) continue;

          const caught =
            it.x + it.r * 0.7 > basket.x + 2 &&
            it.x - it.r * 0.7 < basket.x + basket.w - 2 &&
            it.y + it.r * 0.8 > basket.y + 2 &&
            it.y - it.r < basket.y + basket.h;

          if (caught) {
            items.splice(i, 1);
            if (it.type === "bomb") {
              hearts -= 1;
              updateHearts();
              explode(it.x, it.y);
              addFloater(it.x, it.y - 24, "-1 ♥", "#fca5a5");
              basket.hit = 22;
              basket.hitColor = "239,68,68";
              if (hearts <= 0) {
                dying = true;
                dyingTimer = 55;
              }
            } else if (it.type === "penalty") {
              score = Math.max(0, score - PENALTY_POINTS);
              scoreText.textContent = String(score);
              addSparkles(it.x, it.y, "#a3e635", 12);
              addFloater(it.x, it.y - 22, "-" + PENALTY_POINTS, "#bef264");
              basket.hit = 16;
              basket.hitColor = "132,204,22";
              shake = Math.max(shake, 5);
            } else {
              score += it.points;
              scoreText.textContent = String(score);
              addSparkles(it.x, it.y, it.kind === "star" ? "#fff7ae" : "#fde047", it.kind === "star" ? 18 : 10);
              addFloater(it.x, it.y - 22, "+" + it.points, it.kind === "star" ? "#fde047" : "#fef3c7");
              checkStageProgression();
            }
            continue;
          }

          if (it.y - it.r > canvas.height) {
            items.splice(i, 1);
          }
        }

        for (let i = sparkles.length - 1; i >= 0; i--) {
          const sp = sparkles[i];
          sp.x += sp.vx;
          sp.y += sp.vy;
          sp.life -= 0.035;
          if (sp.life <= 0) {
            sparkles.splice(i, 1);
            continue;
          }
          ctx.globalAlpha = Math.max(0, sp.life);
          ctx.fillStyle = sp.color;
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, 3.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }

        drawBasket();
        drawEffects();
        ctx.restore();

        if (flash > 0.01) {
          ctx.fillStyle = "rgba(255, 190, 110, " + flash.toFixed(2) + ")";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          flash *= 0.86;
        }

        if (dying) {
          dyingTimer--;
          if (dyingTimer <= 0) {
            endGame();
            return;
          }
        }

        if (running) {
          rafId = requestAnimationFrame(loop);
        }
      }

      function buildTips() {
        const grid = document.getElementById("tipsGrid");
        const danger = document.getElementById("tipsDanger");
        if (!grid || !danger) return;
        const mk = (kind, label, cls) => {
          const cell = document.createElement("div");
          cell.className = "tip-cell" + (cls ? " " + cls : "");
          const cv = document.createElement("canvas");
          cv.width = 96;
          cv.height = 96;
          const c = cv.getContext("2d");
          c.translate(48, 48);
          c.scale(1.7, 1.7);
          DRAWERS[kind](c, 0);
          const sp = document.createElement("span");
          sp.textContent = label;
          cell.appendChild(cv);
          cell.appendChild(sp);
          return cell;
        };
        GIFT_ORDER.forEach((k) => {
          grid.appendChild(mk(k, "+" + ITEM_TYPES[k].points, k === "star" ? "top" : ""));
        });
        danger.appendChild(mk("bomb", "扣 1 顆心", "bad"));
        danger.appendChild(mk("poison", "扣 " + PENALTY_POINTS + " 分", "bad"));
      }
      buildTips();

      window.addEventListener("keydown", function (e) {
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
      });

      window.addEventListener("keyup", function (e) {
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
      });

      function moveBasketByClientX(clientX) {
        if (!running) return;
        const rect = canvas.getBoundingClientRect();
        const xInCanvas = ((clientX - rect.left) / rect.width) * canvas.width;
        basket.x = Math.max(6, Math.min(canvas.width - basket.w - 6, xInCanvas - basket.w / 2));
      }

      canvas.addEventListener("touchmove", function (e) {
        e.preventDefault();
        if (e.touches && e.touches.length) {
          moveBasketByClientX(e.touches[0].clientX);
        }
      }, { passive: false });

      canvas.addEventListener("mousemove", function (e) {
        if (e.buttons === 1) {
          moveBasketByClientX(e.clientX);
        }
      });

      window.startHarvestGame = startGame;
    })();
  </script>
</body>
