<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>秋日豐收・感恩籃子</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(170deg, #24170f 0%, #130c07 100%);
      color: #fffbeb;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      touch-action: none;
    }

    .game-shell {
      position: relative;
      width: 380px;
      max-width: 94vw;
      height: 560px;
      max-height: 86vh;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 46px rgba(0, 0, 0, 0.68);
      border: 1.5px solid rgba(251, 191, 36, 0.42);
      background: linear-gradient(180deg, #3a2214 0%, #633818 56%, #45250e 100%);
    }

    canvas#gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .top-bar {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: bold;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.75);
      pointer-events: none;
      z-index: 6;
      gap: 6px;
    }
    .pill {
      background: rgba(18, 10, 5, 0.6);
      border: 1px solid rgba(253, 230, 138, 0.18);
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .score-pill { color: #fde68a; }
    .blessing-pill { color: #fcd34d; }
    .hearts-pill { color: #fca5a5; }

    /* 改善：改放頂部精簡浮動條，不遮擋中下段接物視線 */
    #gratitudeBanner {
      position: absolute;
      top: 46px;
      left: 12px;
      right: 12px;
      background: rgba(255, 251, 235, 0.94);
      color: #3b2314;
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 12px;
      line-height: 1.4;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      border-left: 4px solid #d97706;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      z-index: 8;
    }
    #gratitudeBanner.show {
      opacity: 1;
      transform: translateY(0);
    }
    #gratitudeBanner strong {
      color: #b45309;
      margin-right: 4px;
      font-size: 11.5px;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(20, 12, 7, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 22px;
      z-index: 15;
    }
    #overlay h1 {
      font-size: 24px;
      color: #fde68a;
      margin-bottom: 10px;
      letter-spacing: 1.5px;
    }
    #overlay p {
      font-size: 13.5px;
      line-height: 1.65;
      color: #f3e8d2;
      margin-bottom: 12px;
    }
    .tips-box {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(253, 230, 138, 0.16);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12.5px;
      line-height: 1.7;
      color: #fde68a;
      margin-bottom: 16px;
      width: 100%;
    }
    .unlocked-list {
      text-align: left;
      max-height: 145px;
      overflow-y: auto;
      width: 100%;
      background: rgba(255, 251, 235, 0.08);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 16px;
      font-size: 12.5px;
      line-height: 1.55;
      color: #fef3c7;
      display: none;
    }
    #startBtn {
      background: linear-gradient(135deg, #f59e0b, #c26d10);
      color: #1c0f06;
      border: none;
      border-radius: 12px;
      padding: 11px 28px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.35);
    }
    #startBtn:active { transform: scale(0.96); }

    .footer-hint {
      margin-top: 8px;
      font-size: 12.5px;
      color: #cbb697;
    }
  </style>
</head>
<body>

  <div class="game-shell">
    <div class="top-bar">
      <div class="pill score-pill">分數：<span id="scoreText">0</span></div>
      <div class="pill blessing-pill">祝福：<span id="blessingText">0</span>/5</div>
      <div class="pill hearts-pill" id="heartsText">♥♥♥</div>
    </div>

    <canvas id="gameCanvas" width="380" height="560"></canvas>

    <div id="gratitudeBanner">
      <strong id="bannerTitle">✦ 第1句・速度+30% ✦</strong>
      <span id="gratitudeMsg"></span>
    </div>

    <div id="overlay">
      <h1 id="overlayTitle">🍂 秋日豐收・感恩籃子 🍂</h1>
      <p id="overlayDesc">
        接住豐收好物解鎖感恩祝福（最高 5 句）！<br>
        首句 60 分解鎖，之後每階段所需分數遞增 30 分，且每達階段速度加快 30%。
      </p>
      <div class="tips-box">
        🎃 金黃南瓜 +15 🍗 烤火雞腿 +15<br>
        🍎 紅蘋果 +10 🌽 金穗玉米 +10<br>
        🔥 焦黑鍋子：碰到會扣 1 顆心（共 3 顆）
      </div>
      <div class="unlocked-list" id="unlockedList"></div>
      <button id="startBtn" type="button" onclick="window.startHarvestGame()">開始豐收</button>
    </div>
  </div>

  <div class="footer-hint">電腦：← → 鍵或滑鼠拖曳 ／ 手機：左右滑動</div>

  <script>
    (function () {
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const scoreText = document.getElementById("scoreText");
      const blessingText = document.getElementById("blessingText");
      const heartsText = document.getElementById("heartsText");
      const banner = document.getElementById("gratitudeBanner");
      const bannerTitle = document.getElementById("bannerTitle");
      const gratitudeMsg = document.getElementById("gratitudeMsg");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayDesc = document.getElementById("overlayDesc");
      const unlockedList = document.getElementById("unlockedList");
      const startBtn = document.getElementById("startBtn");

      const MAX_BLESSINGS = 5;
      const BASE_UNLOCK_SCORE = 60;
      const STAGE_INCREMENT = 30;
      const SPEED_UP_FACTOR = 1.3;

      const gratitudeQuotes = [
        "感謝今天能安穩吃下一頓飯，也感謝願意陪伴與理解你的人。",
        "有些看似平凡的小事，其實正是生活裡最踏實的禮物。",
        "謝謝自己一路走到現在的努力，今天也給自己一點掌聲。",
        "感謝季節的轉換與自然的呼吸，讓人有機會慢下腳步。",
        "把想感謝的人放在心上，傳一聲問候，暖意就會擴散開來。",
        "就算有未完成的事，也記得看見已經擁有的美好與恩典。",
        "感恩不是因為一切都完美，而是願意在日常裡發現微光。",
        "謝謝那些在忙碌中替你留一盞燈、遞一杯熱茶的溫柔時刻。",
        "每一次平安度過的尋常日子，都值得在心裡輕輕說一聲謝謝。",
        "感謝生命中的轉彎與等待，它們正悄悄把你帶往更合適的風景。",
        "當我們開始數算擁有的福氣，心裡的焦慮就會慢慢安靜下來。",
        "謝謝家人與朋友的不完美卻真誠，讓這個世界多了一個可以依靠的角落。",
        "今天的陽光、微風與呼吸，都是無需預約卻準時送達的祝福。",
        "願你的善良總能遇見懂得珍惜的人，也願你被這份溫暖好好接住。",
        "把「謝謝」說出口，不只是給別人的鼓勵，也是送給自己的一份喜樂。"
      ];

      let running = false;
      let rafId = null;
      let score = 0;
      let hearts = 3;
      let speedMultiplier = 1.0;
      let currentStep = BASE_UNLOCK_SCORE;
      let nextMilestone = BASE_UNLOCK_SCORE;

      let roundDeck = [];
      let unlockedQuotes = [];
      let spawnAccumulator = 0;
      let bannerTimer = null;

      const basket = {
        x: 150,
        y: 494,
        w: 78,
        h: 34,
        baseSpeed: 6.8
      };

      const keys = { left: false, right: false };
      let items = [];
      let sparkles = [];

      const leaves = Array.from({ length: 12 }, () => ({
        x: Math.random() * 380,
        y: Math.random() * 560,
        vy: 0.45 + Math.random() * 0.8,
        vx: -0.25 + Math.random() * 0.5,
        size: 5.5 + Math.random() * 4.5,
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.035
      }));

      function drawRoundRect(x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
      }

      function shuffleQuotes() {
        roundDeck = gratitudeQuotes.slice();
        for (let i = roundDeck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = roundDeck[i];
          roundDeck[i] = roundDeck[j];
          roundDeck[j] = tmp;
        }
      }

      function showGratitude(indexNum, quote, accelerated) {
        bannerTitle.textContent = accelerated
          ? "✦ 第" + indexNum + "句・速度+30% ✦"
          : "✦ 第" + indexNum + "句・已達上限 ✦";
        gratitudeMsg.textContent = quote;
        banner.classList.add("show");
        clearTimeout(bannerTimer);
        bannerTimer = setTimeout(() => {
          banner.classList.remove("show");
        }, 2200);
      }

      function updateHearts() {
        heartsText.textContent =
          "♥".repeat(Math.max(0, hearts)) + "♡".repeat(Math.max(0, 3 - hearts));
      }

      function updateBlessingHud() {
        blessingText.textContent = String(unlockedQuotes.length);
      }

      function startGame() {
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }

        score = 0;
        hearts = 3;
        speedMultiplier = 1.0;
        currentStep = BASE_UNLOCK_SCORE;
        nextMilestone = BASE_UNLOCK_SCORE;

        shuffleQuotes();
        unlockedQuotes = [];
        spawnAccumulator = 45;
        items = [];
        sparkles = [];
        basket.x = (canvas.width - basket.w) / 2;

        scoreText.textContent = "0";
        updateBlessingHud();
        updateHearts();
        banner.classList.remove("show");
        unlockedList.style.display = "none";
        unlockedList.innerHTML = "";
        overlay.style.display = "none";

        running = true;
        rafId = requestAnimationFrame(loop);
      }

      function endGame() {
        running = false;
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }

        overlayTitle.textContent = "🍂 豐收告一段落 🍂";
        overlayDesc.innerHTML =
          "本次得分：<strong>" + score + "</strong> 分 ｜ 獲得祝福：<strong>" +
          unlockedQuotes.length + " / " + MAX_BLESSINGS + "</strong> 句";

        if (unlockedQuotes.length > 0) {
          unlockedList.style.display = "block";
          unlockedList.innerHTML =
            '<div style="font-weight:bold;margin-bottom:6px;color:#fbbf24;">本局得到的感恩祝福：</div>' +
            unlockedQuotes
              .map((q, idx) => '<div style="margin-bottom:6px;">' + (idx + 1) + ". " + q + "</div>")
              .join("");
        }

        startBtn.textContent = "再玩一次";
        overlay.style.display = "flex";
      }

      function checkStageProgression() {
        while (score >= nextMilestone) {
          speedMultiplier *= SPEED_UP_FACTOR;

          if (unlockedQuotes.length < MAX_BLESSINGS) {
            if (roundDeck.length === 0) shuffleQuotes();
            const quote = roundDeck.pop();
            unlockedQuotes.push(quote);
            updateBlessingHud();
            showGratitude(unlockedQuotes.length, quote, true);
          }

          currentStep += STAGE_INCREMENT;
          nextMilestone += currentStep;
        }
      }

      function spawnItem() {
        const r = Math.random();
        let kind = "corn";
        let points = 10;
        if (r < 0.20) {
          kind = "burn";
          points = 0;
        } else if (r < 0.44) {
          kind = "pumpkin";
          points = 15;
        } else if (r < 0.66) {
          kind = "turkey";
          points = 15;
        } else if (r < 0.84) {
          kind = "apple";
          points = 10;
        }

        items.push({
          kind,
          points,
          x: 32 + Math.random() * (canvas.width - 64),
          y: -24,
          r: 18,
          tilt: (Math.random() - 0.5) * 0.28,
          baseVy: 2.5 + Math.random() * 1.4
        });
      }

      function addSparkles(x, y, color) {
        for (let i = 0; i < 10; i++) {
          const ang = (Math.PI * 2 * i) / 10;
          sparkles.push({
            x,
            y,
            vx: Math.cos(ang) * (1.4 + Math.random() * 2.2),
            vy: Math.sin(ang) * (1.4 + Math.random() * 2.2) - 0.8,
            life: 1,
            color
          });
        }
      }

      function drawItem(it) {
        ctx.save();
        ctx.translate(it.x, it.y);
        ctx.rotate(it.tilt);
        ctx.scale(0.9, 0.9);

        if (it.kind === "pumpkin") {
          ctx.strokeStyle = "#4d7c0f";
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(0, -14);
          ctx.quadraticCurveTo(6, -22, 11, -18);
          ctx.stroke();

          ctx.fillStyle = "#3f6212";
          drawRoundRect(-3, -17, 6, 7, 2);
          ctx.fill();

          const pGrad = ctx.createLinearGradient(0, -14, 0, 16);
          pGrad.addColorStop(0, "#fb923c");
          pGrad.addColorStop(0.55, "#ea580c");
          pGrad.addColorStop(1, "#9a3412");

          ctx.fillStyle = pGrad;
          ctx.beginPath();
          ctx.ellipse(0, 2, 19, 14.5, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = "rgba(124, 45, 18, 0.45)";
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.ellipse(0, 2, 9.5, 14.5, 0, 0, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = "rgba(255, 237, 213, 0.35)";
          ctx.beginPath();
          ctx.ellipse(-6, -4, 4.5, 2.5, -0.35, 0, Math.PI * 2);
          ctx.fill();
        } else if (it.kind === "turkey") {
          ctx.fillStyle = "#fef3c7";
          ctx.strokeStyle = "#d6c7a1";
          ctx.lineWidth = 1.2;
          drawRoundRect(8, -4, 13, 7, 3);
          ctx.fill();
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(21, -3.5, 4.2, 0, Math.PI * 2);
          ctx.arc(21, 2.5, 4.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          const tGrad = ctx.createRadialGradient(-4, -5, 2, 0, 0, 18);
          tGrad.addColorStop(0, "#d97706");
          tGrad.addColorStop(0.65, "#9a3412");
          tGrad.addColorStop(1, "#5c1d0c");

          ctx.fillStyle = tGrad;
          ctx.beginPath();
          ctx.ellipse(-2, 0, 15, 12.5, -0.2, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "rgba(254, 240, 138, 0.28)";
          ctx.beginPath();
          ctx.ellipse(-6, -5, 6, 3, -0.3, 0, Math.PI * 2);
          ctx.fill();
        } else if (it.kind === "apple") {
          ctx.strokeStyle = "#5c3317";
          ctx.lineWidth = 2.4;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(0, -11);
          ctx.lineTo(1, -18);
          ctx.stroke();

          ctx.fillStyle = "#22c55e";
          ctx.beginPath();
          ctx.ellipse(6, -15, 6.5, 3.6, -0.45, 0, Math.PI * 2);
          ctx.fill();

          const aGrad = ctx.createRadialGradient(-4, -4, 2, 0, 1, 17);
          aGrad.addColorStop(0, "#f87171");
          aGrad.addColorStop(0.6, "#dc2626");
          aGrad.addColorStop(1, "#7f1d1d");

          ctx.fillStyle = aGrad;
          ctx.beginPath();
          ctx.arc(-4.5, 1, 11.5, 0, Math.PI * 2);
          ctx.arc(4.5, 1, 11.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
          ctx.beginPath();
          ctx.ellipse(-7, -5, 3, 5.5, 0.25, 0, Math.PI * 2);
          ctx.fill();
        } else if (it.kind === "corn") {
          const cGrad = ctx.createLinearGradient(-10, -15, 10, 12);
          cGrad.addColorStop(0, "#fde047");
          cGrad.addColorStop(0.6, "#eab308");
          cGrad.addColorStop(1, "#ca8a04");

          ctx.fillStyle = cGrad;
          drawRoundRect(-9.5, -16, 19, 28, 9);
          ctx.fill();

          ctx.fillStyle = "rgba(161, 98, 7, 0.35)";
          for (let row = -11; row <= 4; row += 5) {
            for (let col = -5; col <= 5; col += 5) {
              ctx.beginPath();
              ctx.arc(col, row, 1.3, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          ctx.fillStyle = "#16a34a";
          ctx.beginPath();
          ctx.moveTo(-11, 11);
          ctx.quadraticCurveTo(-13, -2, -3, 10);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = "#15803d";
          ctx.beginPath();
          ctx.moveTo(11, 11);
          ctx.quadraticCurveTo(13, -2, 3, 10);
          ctx.closePath();
          ctx.fill();
        } else if (it.kind === "burn") {
          ctx.strokeStyle = "rgba(248, 113, 113, 0.65)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 2, 20, 0, Math.PI * 2);
          ctx.stroke();

          ctx.strokeStyle = "#52525b";
          ctx.lineWidth = 4;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(13, -6);
          ctx.lineTo(22, -13);
          ctx.stroke();

          const bGrad = ctx.createRadialGradient(-4, -3, 2, 0, 2, 17);
          bGrad.addColorStop(0, "#3f3f46");
          bGrad.addColorStop(0.7, "#18181b");
          bGrad.addColorStop(1, "#09090b");

          ctx.fillStyle = bGrad;
          ctx.beginPath();
          ctx.arc(0, 2, 15.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = "#fca5a5";
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(-5, -3);
          ctx.lineTo(5, 7);
          ctx.moveTo(5, -3);
          ctx.lineTo(-5, 7);
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawBasket() {
        ctx.save();
        ctx.translate(basket.x, basket.y);

        const wGrad = ctx.createLinearGradient(0, 4, 0, basket.h);
        wGrad.addColorStop(0, "#c26d1f");
        wGrad.addColorStop(1, "#78350f");

        ctx.fillStyle = wGrad;
        drawRoundRect(0, 4, basket.w, basket.h - 4, 12);
        ctx.fill();

        ctx.strokeStyle = "rgba(255, 247, 214, 0.24)";
        ctx.lineWidth = 1.4;
        for (let gx = 12; gx < basket.w - 8; gx += 13) {
          ctx.beginPath();
          ctx.moveTo(gx, 9);
          ctx.lineTo(gx + 4, basket.h - 3);
          ctx.stroke();
        }

        const rimGrad = ctx.createLinearGradient(0, 0, 0, 9);
        rimGrad.addColorStop(0, "#fbbf24");
        rimGrad.addColorStop(1, "#b45309");

        ctx.fillStyle = rimGrad;
        drawRoundRect(-3, 0, basket.w + 6, 8, 4);
        ctx.fill();

        ctx.restore();
      }

      function loop() {
        if (!running) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < leaves.length; i++) {
          const lf = leaves[i];
          lf.y += lf.vy;
          lf.x += lf.vx;
          lf.rot += lf.vRot;
          if (lf.y > canvas.height + 12) {
            lf.y = -12;
            lf.x = Math.random() * canvas.width;
          }
          ctx.save();
          ctx.translate(lf.x, lf.y);
          ctx.rotate(lf.rot);
          ctx.fillStyle = "rgba(251, 146, 60, 0.22)";
          ctx.beginPath();
          ctx.ellipse(0, 0, lf.size, lf.size * 0.52, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        const moveSpeed = basket.baseSpeed * Math.min(1.6, 1 + (speedMultiplier - 1) * 0.45);
        if (keys.left) basket.x -= moveSpeed;
        if (keys.right) basket.x += moveSpeed;
        basket.x = Math.max(6, Math.min(canvas.width - basket.w - 6, basket.x));

        spawnAccumulator += speedMultiplier;
        if (spawnAccumulator >= 58) {
          spawnItem();
          spawnAccumulator = 0;
        }

        for (let i = items.length - 1; i >= 0; i--) {
          const it = items[i];
          it.y += it.baseVy * speedMultiplier;
          drawItem(it);

          const caught =
            it.x + it.r > basket.x + 4 &&
            it.x - it.r < basket.x + basket.w - 4 &&
            it.y + it.r > basket.y &&
            it.y - it.r < basket.y + basket.h;

          if (caught) {
            if (it.kind === "burn") {
              hearts -= 1;
              updateHearts();
              addSparkles(it.x, it.y, "#f87171");
              items.splice(i, 1);
              if (hearts <= 0) {
                endGame();
                return;
              }
            } else {
              score += it.points;
              scoreText.textContent = String(score);
              addSparkles(it.x, it.y, "#fde047");
              items.splice(i, 1);
              checkStageProgression();
            }
            continue;
          }

          if (it.y - it.r > canvas.height) {
            items.splice(i, 1);
          }
        }

        for (let i = sparkles.length - 1; i >= 0; i--) {
          const sp = sparkles[i];
          sp.x += sp.vx;
          sp.y += sp.vy;
          sp.life -= 0.035;
          if (sp.life <= 0) {
            sparkles.splice(i, 1);
            continue;
          }
          ctx.globalAlpha = Math.max(0, sp.life);
          ctx.fillStyle = sp.color;
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, 3.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }

        drawBasket();
        if (running) {
          rafId = requestAnimationFrame(loop);
        }
      }

      window.addEventListener("keydown", function (e) {
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
      });

      window.addEventListener("keyup", function (e) {
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
      });

      function moveBasketByClientX(clientX) {
        if (!running) return;
        const rect = canvas.getBoundingClientRect();
        const xInCanvas = ((clientX - rect.left) / rect.width) * canvas.width;
        basket.x = Math.max(6, Math.min(canvas.width - basket.w - 6, xInCanvas - basket.w / 2));
      }

      canvas.addEventListener("touchmove", function (e) {
        e.preventDefault();
        if (e.touches && e.touches.length) {
          moveBasketByClientX(e.touches[0].clientX);
        }
      }, { passive: false });

      canvas.addEventListener("mousemove", function (e) {
        if (e.buttons === 1) {
          moveBasketByClientX(e.clientX);
        }
      });

      window.startHarvestGame = startGame;
    })();
  </script>
</body>
</html>
